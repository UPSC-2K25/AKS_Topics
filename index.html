<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UPSC CSE Topic Bank</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>UPSC High-Yield Knowledge Base</h1>
      <p class="subtitle">Systematic Topic Registry with Live Filters & Micro-Sentences</p>
    </header>

    <!-- Control Bar -->
    <section class="controls-panel">
      <div class="control-group">
        <label for="searchInput">Search Topics & Passages</label>
        <input 
          type="text" 
          id="searchInput" 
          placeholder="Type keyword (e.g., GLOF, Article 44, SEBI)..."
          autocomplete="off"
        >
      </div>

      <div class="control-row">
        <div class="control-group">
          <label for="subjectFilter">Subject</label>
          <select id="subjectFilter">
            <option value="ALL">All Subjects</option>
          </select>
        </div>

        <div class="control-group">
          <label for="priorityFilter">Priority Level</label>
          <select id="priorityFilter">
            <option value="ALL">All Priorities</option>
            <option value="High">High</option>
            <option value="Medium">Medium</option>
            <option value="Low">Low</option>
          </select>
        </div>

        <div class="control-group reset-group">
          <button id="resetBtn" class="secondary-btn" type="button">Reset Filters</button>
        </div>
      </div>
    </section>

    <!-- Meta Status Bar -->
    <div class="status-bar">
      <span id="resultsCount">Loading topics...</span>
      <span id="paginationInfo">Page 1 of 1</span>
    </div>

    <!-- Cards Container -->
    <main id="cardsContainer" class="cards-list" aria-live="polite">
      <!-- Generated via app.js -->
    </main>

    <!-- Pagination Controls -->
    <nav class="pagination-bar" aria-label="Topic navigation">
      <button id="firstBtn" class="page-btn">&laquo; First</button>
      <button id="prevBtn" class="page-btn">&lsaquo; Prev</button>
      <div id="pageNumberButtons" class="page-numbers"></div>
      <button id="nextBtn" class="page-btn">Next &rsaquo;</button>
      <button id="lastBtn" class="page-btn">Last &raquo;</button>
    </nav>
  </div>

  <script src="app.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knowledge Vault | Study Reader</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <!-- Custom Stylesheet -->
  <link rel="stylesheet" href="./style.css">
</head>
<body class="bg-slate-100 text-slate-900 h-screen flex flex-col overflow-hidden">

  <!-- Top App Bar -->
  <header class="bg-white border-b border-slate-200 shrink-0 z-30 px-4 py-2 flex items-center justify-between shadow-xs">
    <div class="flex items-center gap-2.5">
      <div class="w-7 h-7 rounded bg-indigo-600 text-white flex items-center justify-center font-bold text-sm shadow-xs">
        📚
      </div>
      <div>
        <h1 class="text-xs font-bold text-slate-900 leading-tight">UPSC Study Knowledge Vault</h1>
        <p class="text-[10px] text-slate-500">Hierarchical Document Explorer</p>
      </div>
    </div>
    <div class="text-[11px] text-slate-400 font-medium hidden sm:block">
      Select a category & topic from the sidebar to read notes
    </div>
  </header>

  <!-- Split-Pane Workspace -->
  <div class="flex-1 flex overflow-hidden">
    
    <!-- LEFT SIDEBAR: Categories & Topic Navigation -->
    <aside class="w-72 bg-white border-r border-slate-200 flex flex-col shrink-0">
      
      <!-- Category Selector Dropdown -->
      <div class="p-2.5 border-b border-slate-100 bg-slate-50/50">
        <label class="block text-[9px] font-bold uppercase tracking-wider text-slate-400 mb-1">Major Category</label>
        <div class="relative">
          <select 
            id="categorySelect" 
            class="w-full appearance-none pl-2.5 pr-7 py-1.5 text-xs font-semibold bg-white border border-slate-200 focus:ring-1 focus:ring-indigo-500 focus:outline-none rounded cursor-pointer text-slate-800 shadow-2xs"
          >
            <!-- Populated dynamically -->
          </select>
          <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-slate-500">
            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
          </div>
        </div>
      </div>

      <!-- Topic Search Input -->
      <div class="p-2 border-b border-slate-100">
        <div class="relative">
          <input 
            type="text" 
            id="sidebarSearch" 
            placeholder="Filter topics..." 
            class="w-full pl-7 pr-2.5 py-1 text-xs bg-slate-100 focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none rounded border border-slate-200 transition-all placeholder:text-slate-400"
          />
          <svg class="w-3 h-3 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Scrollable Topic List Container -->
      <div id="topicListContainer" class="flex-1 overflow-y-auto p-1.5 space-y-1">
        <!-- Populated dynamically as rows -->
      </div>
    </aside>

    <!-- RIGHT MAIN PANEL: Document Reader Workspace -->
    <main class="flex-1 bg-white flex flex-col overflow-hidden">
      
      <!-- Reader Header Bar -->
      <div class="bg-white border-b border-slate-200 px-4 py-2 shrink-0 flex items-center justify-between shadow-2xs">
        <div>
          <div class="flex items-center gap-2 mb-0.5">
            <span id="readerBadge" class="text-[9px] px-1.5 py-0.2 rounded font-bold uppercase tracking-wider"></span>
            <span id="readerCount" class="text-[11px] text-slate-400 font-medium"></span>
          </div>
          <h2 id="readerTitle" class="text-sm font-bold text-slate-900 leading-tight">Select a topic to start reading</h2>
        </div>
        
        <!-- Document Content Search -->
        <div class="relative w-80">
          <input 
            type="text" 
            id="contentSearch" 
            placeholder="Search inside notes..." 
            class="w-full pl-7 pr-2.5 py-1 text-xs bg-slate-100 focus:bg-white focus:ring-1 focus:ring-indigo-500 focus:outline-none rounded border border-slate-200 transition-all placeholder:text-slate-400"
          />
          <svg class="w-3 h-3 text-slate-400 absolute left-2.5 top-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>

      <!-- Main Reader Content Area (Maximum Horizontal Width & High Information Density) -->
      <div class="flex-1 overflow-y-auto px-4 py-2 w-full">
        <ul id="readerContent" class="w-full divide-y divide-slate-100">
          <!-- Populated dynamically as dense inline bullets -->
        </ul>
      </div>

    </main>

  </div>

  <!-- Main Script -->
  <script src="./app.js"></script>
</body>
</html>
